name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Main Dependencies
        run: npm install
        working-directory: .

      - name: Build Main Site
        run: npm run build
        working-directory: .

      - name: Install Pitch Deck Dependencies
        run: cd refillo-pitch && npm install

      - name: Build Pitch Deck
        run: cd refillo-pitch && npm run build

      - name: Nest Pitch Deck in Main Build
        run: |
          mkdir -p dist/pitch-content
          cp -r refillo-pitch/dist/* dist/pitch-content/
          # Ensure assets are copied correctly if nested
          if [ -d "refillo-pitch/dist/assets" ]; then
            cp -r refillo-pitch/dist/assets dist/pitch-content/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
